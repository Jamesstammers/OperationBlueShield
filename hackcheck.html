:root{
  --bg:#020604; --panel:rgba(2,14,8,.82); --line:#0d3b22;
  --g:#00ff66; --g2:#00c853; --gdim:#127a3e; --red:#ff2b4e; --amber:#ffb000; --cyan:#00e5ff; --txt:#b9ffd4; --mut:#5c9e78;
  --mono:'JetBrains Mono',ui-monospace,Consolas,'Courier New',monospace; --pix:'VT323',var(--mono);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:15px;min-height:100%;overflow-x:hidden}
::selection{background:var(--g);color:#000}
#rain{position:fixed;inset:0;z-index:0;opacity:.22;pointer-events:none}
.crt{position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
  box-shadow:inset 0 0 160px rgba(0,0,0,.95)}
.crt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,255,102,.05),transparent 70%);animation:flick 4s infinite}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.85}52%{opacity:.6}54%{opacity:.9}}
.wrap{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:18px 16px 80px}

/* status bar */
.status{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;font-size:12px;color:var(--mut);border-bottom:1px dashed var(--line);padding-bottom:8px}
.status b{color:var(--g)} .blink{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
.status button{background:none;border:1px solid var(--line);color:var(--mut);font:inherit;cursor:pointer;padding:1px 8px}
.status button:hover{color:var(--g);border-color:var(--g)}

/* logo */
header{text-align:center;padding:34px 0 10px}
.glitch{position:relative;display:inline-block;font-family:var(--pix);font-size:clamp(54px,11vw,120px);line-height:.9;color:var(--g);letter-spacing:4px;
  text-shadow:0 0 6px var(--g),0 0 24px rgba(0,255,102,.55)}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden}
.glitch::before{color:var(--red);transform:translate(-3px,0);clip-path:inset(0 0 60% 0);animation:g1 2.6s infinite linear alternate-reverse;mix-blend-mode:screen}
.glitch::after{color:var(--cyan);transform:translate(3px,0);clip-path:inset(55% 0 0 0);animation:g2 3.1s infinite linear alternate-reverse;mix-blend-mode:screen}
@keyframes g1{0%{clip-path:inset(0 0 85% 0)}20%{clip-path:inset(40% 0 40% 0)}40%{clip-path:inset(10% 0 70% 0)}60%{clip-path:inset(70% 0 5% 0)}80%{clip-path:inset(30% 0 50% 0)}100%{clip-path:inset(0 0 95% 0)}}
@keyframes g2{0%{clip-path:inset(80% 0 0 0)}25%{clip-path:inset(20% 0 60% 0)}50%{clip-path:inset(60% 0 20% 0)}75%{clip-path:inset(5% 0 85% 0)}100%{clip-path:inset(45% 0 35% 0)}}
.tag{color:var(--mut);margin-top:10px;font-size:14px;min-height:1.4em}
.tag .cur{display:inline-block;width:9px;height:1em;background:var(--g);vertical-align:-2px;animation:blink 1s steps(1) infinite}

/* tabs */
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:22px 0 18px}
nav button{font:600 14px var(--mono);background:rgba(0,30,15,.6);color:var(--mut);border:1px solid var(--line);padding:10px 18px;cursor:pointer;letter-spacing:1px;position:relative;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
nav button:hover{color:var(--g);border-color:var(--gdim)}
nav button.on{color:#000;background:var(--g);border-color:var(--g);box-shadow:0 0 18px rgba(0,255,102,.5)}
.tab{display:none}.tab.on{display:block;animation:fadein .35s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);padding:18px;margin-bottom:16px;position:relative;backdrop-filter:blur(2px)}
.panel::before{content:attr(data-h);position:absolute;top:-9px;left:14px;background:var(--bg);padding:0 8px;font-size:11px;letter-spacing:2px;color:var(--g)}
.corner{position:absolute;width:10px;height:10px;border-color:var(--g);border-style:solid}
.c1{top:-1px;left:-1px;border-width:2px 0 0 2px}.c2{top:-1px;right:-1px;border-width:2px 2px 0 0}.c3{bottom:-1px;left:-1px;border-width:0 0 2px 2px}.c4{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

/* input */
.cmd{display:flex;align-items:stretch;border:1px solid var(--gdim);background:#000;box-shadow:0 0 0 1px rgba(0,255,102,.08),0 0 30px rgba(0,255,102,.08) inset}
.cmd:focus-within{border-color:var(--g);box-shadow:0 0 22px rgba(0,255,102,.35)}
.cmd .pr{padding:0 12px;display:flex;align-items:center;color:var(--g);font-weight:800;white-space:nowrap}
.cmd input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--g);font:600 18px var(--mono);padding:14px 4px;caret-color:var(--g)}
.cmd input::placeholder{color:#1f5c3a}
input::-ms-reveal,input::-ms-clear{display:none}
.btn{font:800 15px var(--mono);letter-spacing:2px;background:var(--g);color:#000;border:0;padding:0 22px;cursor:pointer;transition:.15s}
.btn:hover{background:#7dffb0;box-shadow:0 0 22px var(--g)}
.btn:disabled{background:var(--gdim);cursor:wait}
.ghost{font:600 12px var(--mono);background:none;color:var(--mut);border:1px solid var(--line);padding:6px 12px;cursor:pointer;letter-spacing:1px}
.ghost:hover,.ghost.on{color:var(--g);border-color:var(--g)}
.ghost.on{background:rgba(0,255,102,.1)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.small{font-size:12px;color:var(--mut)}
.eye{background:none;border:0;color:var(--mut);cursor:pointer;font:600 12px var(--mono);padding:0 10px}
.eye:hover{color:var(--g)}

/* terminal log */
.log{font-size:13px;line-height:1.6;min-height:20px;margin-top:14px;white-space:pre-wrap;word-break:break-all}
.log .ok{color:var(--g)}.log .bad{color:var(--red)}.log .warn{color:var(--amber)}.log .dim{color:var(--mut)}.log .cy{color:var(--cyan)}

/* verdict */
.verdict{text-align:center;padding:26px 10px;margin-top:14px;border:2px solid;position:relative;overflow:hidden}
.verdict h2{font-family:var(--pix);font-size:clamp(40px,7vw,72px);margin:0;line-height:1;letter-spacing:3px}
.verdict p{margin:8px 0 0;font-size:15px}
.verdict.pwned{border-color:var(--red);color:var(--red);background:rgba(255,43,78,.08);text-shadow:0 0 14px rgba(255,43,78,.7);animation:alarm 1s 3}
.verdict.safe{border-color:var(--g);color:var(--g);background:rgba(0,255,102,.06);text-shadow:0 0 14px rgba(0,255,102,.6)}
@keyframes alarm{0%,100%{background:rgba(255,43,78,.08)}50%{background:rgba(255,43,78,.35)}}
.verdict .sim{position:absolute;top:8px;right:-34px;transform:rotate(35deg);background:var(--amber);color:#000;font-size:11px;font-weight:800;padding:3px 40px;letter-spacing:2px;text-shadow:none}

/* breach cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}
.card{border:1px solid var(--line);background:rgba(0,0,0,.55);padding:14px;position:relative;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--gdim);transform:translateY(-2px)}
.card.hit{border-left:3px solid var(--red)}
.card h3{margin:0 0 4px;font-size:16px;color:#fff;display:flex;justify-content:space-between;gap:8px}
.card h3 span{color:var(--amber);font-size:12px;font-weight:400}
.card .rec{color:var(--red);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11px;padding:2px 7px;border:1px solid var(--line);color:var(--txt);background:rgba(0,255,102,.05)}
.chip.r{border-color:rgba(255,43,78,.5);color:#ff8a9d;background:rgba(255,43,78,.08)}
.card .desc{display:none;margin-top:8px;font-size:12px;color:var(--mut);line-height:1.5}
.card.open .desc{display:block}
.bar{height:4px;background:#06210f;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--red))}

/* strength */
.meter{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:14px 0 6px}
.meter i{height:12px;background:#07200f;transition:.25s}

  if(/[^a-zA-Z0-9]/.test(pw))cs+=SYMSET;
  for(const c of pw)if(!cs.includes(c))cs+=c;return cs}
function runAttack(){const id=++atkRun;atkLive=true;$("#atkClose").textContent="STOP";
  const pw=$("#pw").value,cs=buildCharset(pw),N=cs.length,tgt=$("#atkTgt"),res=$("#atkRes");
  res.style.color="var(--amber)";
  const idx=[0],t0=performance.now();let tried=0,found=false,cur="";
  const theoSecs=Math.pow(N,pw.length)/HEAD.rate;
  const candidate=()=>{let str="";for(const i of idx)str+=cs[i];return str};
  const inc=()=>{let k=idx.length-1;while(k>=0){if(++idx[k]<N)return;idx[k]=0;k--}idx.length++;for(let i=0;i<idx.length;i++)idx[i]=0};
  function step(){
    if(id!==atkRun||!atkLive)return finish(false);
    const deadline=performance.now()+28;            // ~1 frame of real work
    while(performance.now()<deadline){cur=candidate();tried++;if(cur===pw){found=true;break}inc()}
    const el=performance.now()-t0,rate=tried/(el/1000)||0;
    if(!found)tgt.innerHTML=`<span class="sc">${esc(cur)||"&nbsp;"}</span>`;
    $("#atkRate").textContent=fmtN(rate);$("#atkTries").textContent=tried<1e6?Math.floor(tried).toLocaleString():fmtN(tried);
    $("#atkEta").textContent=hms(el);
    if(found)return finish(true);
    res.textContent=`${tried.toLocaleString()} GUESSES TRIED` + (theoSecs>el/1000?`  ·  ~${fmtTime(theoSecs)} FOR A GPU` : "");
    if(Math.random()<.5)beep(1400+Math.random()*2600,.006,"square",.012);
    atkTimer=setTimeout(step,0);
  }
  function finish(cracked){$("#atkClose").textContent="CLOSE";const el=performance.now()-t0;
    if(cracked){atkLive=false;tgt.innerHTML=`<span class="lk" style="color:var(--red)">${esc(pw)}</span>`;res.style.color="var(--red)";
      res.innerHTML=`CRACKED IN ${el<1000?(el|0)+" ms":hms(el)}<div class="pwsum" style="color:#ff9aab">Found after really trying ${tried.toLocaleString()} combinations. A hacker's GPU would reach this ${fmtN(HEAD.rate/Math.max(1,tried/(el/1000)))}× faster.</div>`;alarm()}
    else{res.style.color="var(--g)";res.innerHTML=`STOPPED AFTER ${tried.toLocaleString()} GUESSES<div class="pwsum" style="color:var(--mut)">Still not found. At ${fmtTime(theoSecs)} to try every combination, brute force alone won't get there.</div>`;chime()}
  }
  step();
}

/* ---- email ---- */
let mode=ls.get("pwn_mode")||"live";
function setMode(m){mode=m;ls.set("pwn_mode",m);$$("[data-mode]").forEach(b=>b.classList.toggle("on",b.dataset.mode===m))}
setMode(mode);$$("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
const normName=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
const LOCAL=new Map(BREACHES.map(b=>[normName(b.n),b]));
let xon=null;async function xonCat(){if(xon)return xon;xon=new Map();try{const j=await (await fetch("https://api.xposedornot.com/v1/breaches")).json();(j.exposedBreaches||[]).forEach(b=>xon.set(normName(b.breachID),b))}catch(e){}return xon}
$("#emailForm").onsubmit=async e=>{e.preventDefault();const email=$("#email").value.trim(),out=$("#emailOut"),btn=$("#scanBtn");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){out.innerHTML='<div class="log bad" style="color:var(--red)">Invalid email</div>';$("#emailModal").classList.add("on");return}
  btn.disabled=true;out.innerHTML='<div class="log dim" style="color:var(--mut)">Scanning<span class="blink">_</span></div>';$("#emailModal").classList.add("on");let names;
  try{if(mode==="live"){const r=await fetch("https://api.xposedornot.com/v1/check-email/"+encodeURIComponent(email));
      if(r.status===404)names=[];else{const j=await r.json();if(j.Error&&/not found/i.test(j.Error))names=[];else if(Array.isArray(j.breaches))names=j.breaches.flat().filter(Boolean);else throw 0}}
    else{await sleep(700);names=simulate(email)}}
  catch(ex){out.innerHTML='<div class="row"><span style="color:var(--red)">Lookup failed</span><button class="ghost" id="goSim">USE OFFLINE DEMO</button></div>';$("#goSim").onclick=()=>{setMode("sim");$("#emailForm").requestSubmit()};$("#emailModal").classList.add("on");btn.disabled=false;return}
  const cat=mode==="live"?await xonCat():new Map();
  const info=names.map(nm=>{const k=normName(nm),x=cat.get(k),l=LOCAL.get(k);return{n:nm,y:x?.breachedDate?new Date(x.breachedDate).getFullYear():l?.y,r:x?.exposedRecords||l?.r,d:(x?.exposedData?.length?x.exposedData:l?.d)||[],t:brief(l?.t||x?.exposureDescription)}}).sort((a,b)=>(b.y||0)-(a.y||0));
  const sim="";
  if(info.length){alarm();out.innerHTML=`<div class="verdict pwned">${sim}<h2>PWNED</h2><p>${info.length} breach${info.length>1?"es":""}</p></div><div class="cards">${info.map(b=>`<div class="card hit"><h3>${esc(b.n)}<span>${b.y||""}</span></h3>${b.r?`<div class="rec">${fmtN(b.r)} accounts exposed</div>`:""}${b.t?`<div class="sum">${esc(b.t)}</div>`:""}<div class="chips">${b.d.slice(0,5).map(d=>`<span class="chip ${SENSITIVE.test(d)?"r":""}">${esc(d)}</span>`).join("")}</div></div>`).join("")}</div>`}
  else{chime();out.innerHTML=`<div class="verdict safe">${sim}<h2>NOT PWNED</h2></div>`}
  btn.disabled=false};
function simulate(email){const e=email.toLowerCase();if(/safe|clean|secure/.test(e))return[];const h=sha1(utf8(e));let seed=parseInt(h.slice(0,8),16);const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  const hot=/pwned|hacked|owned/.test(e);if(!hot&&rnd()<.25)return[];const cnt=hot?7+Math.floor(rnd()*5):1+Math.floor(rnd()*5),pool=BREACHES.map(b=>b.n),out=[];
  while(out.length<cnt&&pool.length)out.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]);return out}

/* ---- wipe / idle ---- */
function wipe(){atkRun++;atkLive=false;clearTimeout(atkTimer);$("#atk").classList.remove("on");$("#pwModal").classList.remove("on");$("#emailModal").classList.remove("on");cur=null;$("#email").value="";$("#emailOut").innerHTML="";$("#pw").value="";pwnCount=null;pwnSeq++;render();beep(300,.1)}
$("#wipeBtn").onclick=wipe;addEventListener("keydown",e=>{if(e.key==="Escape")wipe()});
let idle;const resetIdle=()=>{clearTimeout(idle);idle=setTimeout(()=>{if($("#pw").value||$("#email").value)wipe()},120000)};
["keydown","pointerdown","pointermove"].forEach(ev=>addEventListener(ev,resetIdle));resetIdle();
$("#pw").focus();

</script>
